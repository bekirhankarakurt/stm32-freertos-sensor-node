name: Docs & Coverage

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Coverage report and API docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build doxygen graphviz
          pipx install gcovr==8.8
      - name: Build and test with coverage
        run: |
          cmake --preset host-coverage
          cmake --build --preset host-coverage
          ctest --preset host-coverage
      - name: Coverage report
        run: |
          mkdir -p site/coverage
          gcovr -r . build/host-coverage --filter 'common/' --filter 'app/' --filter 'tools/' --filter 'sim/' \
            --exclude-unreachable-branches \
            --html-details site/coverage/index.html --json-summary site/coverage/summary.json --print-summary
          python3 scripts/coverage_badge.py site/coverage/summary.json site/coverage/badge.json
          echo "### Coverage: $(python3 -c "import json;print(json.load(open('site/coverage/badge.json'))['message'])")" >> "$GITHUB_STEP_SUMMARY"
      - name: API documentation
        run: |
          doxygen docs/Doxyfile
          cp docs/index.html site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
